version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      compatible-cargo-patches:
        applies-to: version-updates
        update-types:
          - patch
    # Version changes that disrupt GPUI/WKWebView must fail the compatibility
    # gate and require a real native-app Host E2E before downstream promotion.
    # These exact pins form the Host/Adapter GPUI type compatibility boundary.
    # upstream-compat.yml owns coordinated version updates after Host migration.
    # Keep Dependabot alerts enabled; security fixes that require a core migration
    # and any lb-wry/API changes outside the supported patch series need review.
    ignore:
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-platform
      - dependency-name: gpui-wry
      - dependency-name: lb-wry
