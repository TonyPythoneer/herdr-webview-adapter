name: adapter-chrome-renderer-prewarm
on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/renderer_prewarm.rs'
      - '.github/workflows/chrome-renderer-prewarm.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrome-renderer-prewarm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ${{ runner.temp }}/herdr-perf-target
          key: herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-chrome-renderer-prewarm
          restore-keys: |
            herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run paired experiment
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-perf-target
        run: |
          set -euo pipefail
          mkdir -p probe-report
          git rev-parse HEAD > probe-report/revision.txt
          sw_vers > probe-report/environment.txt
          cargo build --release --example renderer_prewarm
          cp Cargo.lock probe-report/Cargo.lock
          export HERDR_CHROME_BINARY="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          D="$(mktemp -d)"
          HERDR_APP_HOME="$D" "$CARGO_TARGET_DIR/release/examples/renderer_prewarm" | tee probe-report/samples.jsonl
          rm -rf "$D"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-renderer-prewarm-${{ github.run_attempt }}
          path: probe-report/
          if-no-files-found: warn
          retention-days: 30
