name: adapter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: adapter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-tests:
    name: portable-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - run: cargo test --all-targets
      - name: Upstream compatibility contract and probe unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_upstream_compat.py' -v
          python3 scripts/upstream_compat.py gate .github/upstream-compat.json

  macos-native-tests:
    name: macos-native-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Run portable, WebKit pixel and trusted native input tests
        env:
          HERDR_APP_HOME: ${{ runner.temp }}/herdr-adapter-native-e2e
          HERDR_WK_NATIVE_SMOKE: "1"
          HERDR_WK_NATIVE_INPUT_E2E: "1"
        run: cargo test --all-targets
