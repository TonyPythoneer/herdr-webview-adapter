name: adapter-frame-scratch-buffer
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/chrome_cdp.rs'
      - 'examples/frame_scratch.rs'
      - '.github/workflows/frame-scratch-buffer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frame-scratch-buffer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ${{ runner.temp }}/herdr-perf-target
          key: herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-frame-scratch-buffer
          restore-keys: |
            herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run paired experiment
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-perf-target
        run: |
          set -euo pipefail
          mkdir -p probe-report
          git rev-parse HEAD > probe-report/revision.txt
          sw_vers > probe-report/environment.txt
          cargo test --lib scratch_reuse_has_no_stale_bytes_after_short_or_invalid_frame
          cargo build --release --example frame_scratch
          cp Cargo.lock probe-report/Cargo.lock
          export HERDR_CHROME_BINARY="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$CARGO_TARGET_DIR/release/examples/frame_scratch" | tee probe-report/samples.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-scratch-buffer-${{ github.run_attempt }}
          path: probe-report/
          if-no-files-found: warn
          retention-days: 30
