name: adapter-performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: performance-${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: portable
            runner: ubuntu-latest
          - suite: native
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # For PRs, test GitHub's merge commit (including latest base files).
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - name: Identify build environment
        id: build-image
        shell: bash
        run: printf 'image=%s-%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust compilation cache
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ${{ runner.temp }}/herdr-perf-target
            ${{ runner.temp }}/herdr-sccache
          key: herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.image }}-rust1.95.0-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.cargo/config*', 'rust-toolchain*') }}
          restore-keys: |
            herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.image }}-rust1.95.0-
      - name: Install pinned sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.10.0
          disable_annotations: 'true'
      - name: Enable bounded local compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/herdr-sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Record cache restore result
        shell: bash
        run: echo "Compilation cache exact hit = ${{ steps.build-cache.outputs.cache-hit }}"
      - name: Restore exact-content binary and fixture cache
        id: content-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/herdr-perf-content
          key: herdr-perf-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.image }}-rust1.95.0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            herdr-perf-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.image }}-rust1.95.0-
      - name: Verify Chrome on native runner
        if: matrix.suite == 'native'
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$CHROME"
          "$CHROME" --version
          echo "HERDR_CHROME_BINARY=$CHROME" >> "$GITHUB_ENV"
      - name: Test report calculations
        run: python3 -m unittest discover -s scripts -p 'test_performance*.py' -v
      - name: Compare fixed baseline and exact PR base with candidate
        env:
          PERF_BUILD_TARGET: ${{ runner.temp }}/herdr-perf-target
          PERF_BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          PERF_CONTENT_CACHE: ${{ runner.temp }}/herdr-perf-content
          PERF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PERF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/performance.py --suite "${{ matrix.suite }}" --out performance-report
      - name: Upload observations and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-performance-${{ matrix.suite }}-${{ github.run_attempt }}
          path: performance-report/
          if-no-files-found: error
          retention-days: 90
