name: adapter-runtime-cache-experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/cache_reuse.rs'
      - 'scripts/runtime_cache_experiment.py'
      - 'scripts/test_runtime_cache_experiment.py'
      - '.github/workflows/runtime-cache-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cache-experiment:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
      - name: Restore existing release compilation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ${{ runner.temp }}/herdr-perf-target
            ${{ runner.temp }}/herdr-sccache
          key: herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-runtime-cache
          restore-keys: |
            herdr-release-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and validate experiment
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-perf-target
        run: |
          mkdir -p cache-report
          python3 -m unittest discover -s scripts -p test_runtime_cache_experiment.py -v
          cargo build --release --example cache_reuse
          cp Cargo.lock cache-report/Cargo.lock
          cargo --version > cache-report/environment.txt
          rustc --version >> cache-report/environment.txt
          sw_vers >> cache-report/environment.txt
          export HERDR_CHROME_BINARY="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$HERDR_CHROME_BINARY" --version >> cache-report/environment.txt
          python3 scripts/runtime_cache_experiment.py --binary "$CARGO_TARGET_DIR/release/examples/cache_reuse" --out cache-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-cache-experiment-${{ github.run_attempt }}
          path: cache-report/
          if-no-files-found: warn
          retention-days: 30
