name: adapter-upstream-compat
on:
  schedule:
    - cron: '17 4 * * 1' # Monday 12:17 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: adapter-upstream-compat
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p 'test_upstream_compat.py' -v
      - name: Compare latest stable upstream and propose audited compatibility update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          read -r tag object_sha < <(git ls-remote --tags --refs https://github.com/herdrdev/herdr-app.git | python3 scripts/upstream_compat.py select)
          read -r current_tag current_object < <(python3 -c 'import json; r=json.load(open(".github/upstream-compat.json")); print(r["tag"],r["tag_object_sha"])')
          if [[ "$tag" == "$current_tag" ]]; then
            if [[ "$object_sha" == "$current_object" ]]; then
              echo "Already audited immutable tag $tag ($object_sha)"
              exit 0
            fi
            echo "::error::Previously audited upstream stable tag $tag MOVED ($current_object -> $object_sha). Refusing silent retag."
            exit 1
          fi
          legacy_branch="automation/upstream-compat-${tag}-${object_sha:0:12}"
          # Old schema-1 branches may have been pushed before PR creation failed.
          # Do not overwrite them or mistake an orphan branch for an existing PR.
          branch="${legacy_branch}-schema2"
          owner="${GH_REPO%%/*}"
          legacy_open="$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base=main -f head="$owner:$legacy_branch" --jq 'length')"
          if [[ "$legacy_open" != 0 ]]; then
            echo "::warning::Legacy upstream proposal is still open; review it before creating a replacement."
            exit 0
          fi
          upstream="$RUNNER_TEMP/herdr-upstream"
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/herdrdev/herdr-app.git
          # Fetch by the *already observed immutable object*, never by a
          # moving tag name; annotated tag objects are peeled only afterwards.
          git -C "$upstream" fetch --depth=1 --filter=blob:none origin "$object_sha"
          fetched_object="$(git -C "$upstream" rev-parse FETCH_HEAD)"
          [[ "$fetched_object" == "$object_sha" ]] || {
            echo "::error::Fetched upstream object does not match observed tag"
            exit 1
          }
          commit="$(git -C "$upstream" rev-parse 'FETCH_HEAD^{commit}')"
          git -C "$upstream" checkout -q FETCH_HEAD -- src/window.rs src/mods.rs src/commands.rs Cargo.toml
          # Resolve dependency changes before creating a branch, PR, or CI run.
          read -r adapter_core upstream_core < <(python3 -c 'import sys; sys.path.insert(0,"scripts"); from coordinated_deps import host_core; from pathlib import Path; print(host_core(Path("Cargo.toml").read_text()),host_core(Path(sys.argv[1]).read_text()))' "$upstream/Cargo.toml")
          if [[ "$adapter_core" != "$upstream_core" ]]; then
            host_sha="$(git ls-remote https://github.com/TonyPythoneer/herdr-webview.git refs/heads/master | cut -f1)"
            [[ "$host_sha" =~ ^[0-9a-f]{40}$ ]]
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              "https://raw.githubusercontent.com/TonyPythoneer/herdr-webview/$host_sha/Cargo.toml" \
              -o "$RUNNER_TEMP/host-Cargo.toml"
            if python3 scripts/coordinated_deps.py --adapter Cargo.toml --upstream "$upstream/Cargo.toml" --host "$RUNNER_TEMP/host-Cargo.toml"; then
              rustup toolchain install 1.95.0 --profile minimal
              if ! cargo +1.95.0 metadata --format-version 1 > "$RUNNER_TEMP/coordinated-metadata.json"; then
                echo "::warning::Candidate failed Cargo dependency resolution. No dependency PR or test CI created."
                exit 0
              fi
            else
              code=$?
              if [[ "$code" == 3 ]]; then exit 0; fi
              exit "$code"
            fi
          fi
          python3 scripts/upstream_compat.py probe --source "$upstream" --tag "$tag" --sha "$commit" --tag-object-sha "$object_sha" > .github/upstream-compat.json
          if [[ "$adapter_core" != "$upstream_core" ]]; then
            if ! python3 scripts/upstream_compat.py gate .github/upstream-compat.json; then
              echo "::warning::Candidate fails upstream compatibility gate. No dependency PR or test CI created."
              exit 0
            fi
          fi
          # A branch alone is not proof of a successful proposal.
          # Recover interrupted runs without force-pushing or duplicating PRs.
          existing="$(gh api --method GET "repos/$GH_REPO/pulls" -f state=all -f base=main -f head="$owner:$branch")"
          if jq -e 'any(.[]; .state == "closed") and (any(.[]; .state == "open") | not)' <<< "$existing" >/dev/null; then
            echo "Proposal previously closed; respecting maintainer decision."
            exit 0
          fi
          remote="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [[ -z "$remote" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "$branch"
            git add Cargo.toml .github/upstream-compat.json
            git commit -m "chore(compat): audit upstream $tag"
            git push origin "HEAD:refs/heads/$branch"
            proposal_sha="$(git rev-parse HEAD)"
          else
            proposal_sha="${remote%%$'\t'*}"
            git fetch --no-tags origin "refs/heads/$branch"
            [[ "$(git rev-parse FETCH_HEAD)" == "$proposal_sha" ]]
            if ! git show "$proposal_sha:Cargo.toml" | cmp -s - Cargo.toml ||
               ! git show "$proposal_sha:.github/upstream-compat.json" | cmp -s - .github/upstream-compat.json; then
              echo "::error::Existing proposal differs from freshly audited candidate. Review branch $branch; refusing to overwrite it."
              exit 1
            fi
          fi
          pr_number="$(jq -r '[.[] | select(.state == "open")][0].number // empty' <<< "$existing")"
          if [[ -z "$pr_number" ]]; then
            compatible="$(python3 -c 'import json; print(json.load(open(".github/upstream-compat.json"))["compatible"])')"
            gh pr create -R "$GH_REPO" -B main -H "$branch" \
              -t "chore(compat): review upstream $tag" \
              -b "Static upstream compatibility report for herdrdev/herdr-app@$tag ($commit). Anchor and GPUI check: $compatible. Any coordinated GPUI dependency changes were resolved before PR creation. This does not automatically change the Host; packaged-app E2E is still required."
          else
            echo "Existing open proposal #$pr_number"
          fi
          # Resume missing CI dispatches after partial failures. Never duplicate
          # a run already created for the exact proposal commit.
          for workflow in ci.yml performance.yml; do
            count="$(gh api --method GET "repos/$GH_REPO/actions/workflows/$workflow/runs" -f head_sha="$proposal_sha" -f per_page=1 --jq '.total_count')"
            if [[ "$count" == 0 ]]; then
              gh workflow run "$workflow" -R "$GH_REPO" --ref "$branch"
            else
              echo "$workflow already triggered for $proposal_sha"
            fi
          done
